name: Build delegation fork for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - codex/delegation-v0.1

permissions:
  contents: read

concurrency:
  group: build-delegation-fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            $exitCode = if ($null -ne $process) { $process.ExitCode } else { 1 }
            throw "Visual Studio Installer failed with exit code $exitCode."
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-fork-windows.ps1 -VerboseBuild

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-delegation-windows-x64-${{ github.run_number }}
          path: release-fork/*
          if-no-files-found: error
          retention-days: 30
